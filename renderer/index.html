<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https: cachu:; media-src https:" />
  <title>Cachusafio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Iconos de contorno, 16 px, un solo set (se usan con <svg><use href="#i-..."/></svg>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-folder" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M1.75 3.75h4.5l1.5 1.5h6.5v7H1.75z"/></symbol>
    <symbol id="i-log" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M3.75 1.75h6l2.5 2.5v10h-8.5zM6 7h4M6 10h4"/></symbol>
    <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M8 3v10M3 8h10"/></symbol>
    <symbol id="i-chev" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M4.5 6.5L8 10l3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.5" d="M4 4l8 8M12 4l-8 8"/></symbol>
    <symbol id="i-ms" viewBox="0 0 16 16"><path fill="currentColor" d="M0 0h7.5v7.5H0zM8.5 0H16v7.5H8.5zM0 8.5h7.5V16H0zM8.5 8.5H16V16H8.5z"/></symbol>
    <!-- marca de Cachusafio: una C de bloques, como el icono del launcher -->
    <symbol id="i-mark" viewBox="0 0 8 8"><path fill="#e0112b" d="M0 0h8v8H0z"/><path fill="#f5f0eb" d="M2 1h4v1H2zM1 2h1v4H1zM2 6h4v1H2zM6 2h1v1H6zM6 5h1v1H6z"/></symbol>
  </svg>

  <!-- ============ Pantalla de login ============ -->
  <section id="login" class="screen hidden">
    <div class="login-box">
      <div class="wordmark"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><b>Cachusafio</b></div>
      <h1 data-i18n="login.title">Inicia sesión</h1>
      <p class="login-sub" data-i18n="login.sub">Con tu cuenta de Microsoft puedes entrar a servidores premium. Si el servidor no la pide, basta con un nombre.</p>

      <button class="btn primary wide" id="btn-ms">
        <svg class="ic" aria-hidden="true"><use href="#i-ms"/></svg>
        <span data-i18n="login.ms">Cuenta Microsoft</span>
      </button>
      <button class="btn wide" id="btn-show-offline" data-i18n="login.offline">Jugar sin cuenta</button>

      <form id="offline-form" class="hidden">
        <label for="offline-name" class="field-label" data-i18n="login.nick">Tu nombre de jugador</label>
        <div class="joined">
          <input id="offline-name" maxlength="16" autocomplete="off" spellcheck="false" aria-describedby="nick-rule" />
          <button class="btn primary" type="submit" data-i18n="login.enter">Entrar</button>
        </div>
        <p class="hint" id="nick-rule" data-i18n="nickRule">3 a 16 letras, números o guion bajo</p>
      </form>
      <p class="err" id="login-error" role="alert"></p>

      <label class="lang">
        <span data-i18n="lang">Idioma</span>
        <select id="lang-login"><option value="es">Español</option><option value="en">English</option></select>
      </label>
    </div>
  </section>

  <!-- ============ Launcher ============ -->
  <section id="app" class="screen hidden">
    <!-- Ruled T-frame: barra lateral y barra superior en el mismo fondo, separadas solo por líneas de 1 px -->
    <aside class="side">
      <div class="brand"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><b id="brand-name">Cachusafio</b><small id="brand-ver"></small></div>

      <p class="label" data-i18n="modpacks">Modpacks</p>
      <nav class="packs" id="packs" aria-label="Modpacks"></nav>
      <button class="nav-item" id="btn-add"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="addPack">Agregar modpack</span></button>

      <div class="side-bottom">
        <button class="nav-item" id="btn-settings"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg><span data-i18n="settings">Ajustes</span></button>
      </div>
    </aside>

    <main class="stage" id="stage">
      <header class="topbar">
        <span class="crumb" id="crumb"></span>
        <a class="update hidden" id="update" target="_blank"></a>
        <span class="spacer"></span>
        <button class="icon-btn" id="btn-folder" data-i18n-title="openFolder" data-i18n-label="openFolder"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg></button>
        <button class="icon-btn" id="btn-log" data-i18n-title="openLog" data-i18n-label="openLog"><svg class="ic" aria-hidden="true"><use href="#i-log"/></svg></button>
        <span class="divider" aria-hidden="true"></span>
        <button class="account" id="btn-account" aria-haspopup="menu">
          <img id="avatar" alt="" />
          <span class="who"><b id="acc-name"></b><small id="acc-type"></small></span>
          <svg class="ic" aria-hidden="true"><use href="#i-chev"/></svg>
        </button>
      </header>

      <div class="canvas">
        <!-- Fila de título: el modpack es el h1; a la derecha, la tarea principal -->
        <div class="title-row">
          <div class="title-text">
            <h1 id="hero-title"></h1>
            <p class="subline" id="hero-desc"></p>
          </div>
          <div class="title-actions">
            <button class="btn danger hidden" id="btn-kill" data-i18n="kill">Cerrar juego</button>
            <button class="play" id="btn-play"><span id="play-label">Jugar</span></button>
          </div>
        </div>
        <div class="progress" id="progress">
          <p id="status"></p>
          <div class="bar hidden" id="bar"><div class="fill" id="fill"></div></div>
        </div>

        <!-- 2 columnas: portada (1fr) + servidor (280px), gap 16. Novedades ocupa las dos debajo -->
        <div class="home-grid">
          <figure class="cover" id="cover">
            <div class="stage-bg" id="stage-bg"></div>
            <img id="hero-logo" class="hidden" alt="" />
            <figcaption class="meta" id="hero-meta"></figcaption>
          </figure>
          <section class="panel server-panel" aria-labelledby="server-h">
            <h2 id="server-h" data-i18n="serverTitle">En el servidor</h2>
            <p class="server-figure"><b class="num" id="server-count">&#8212;</b><span id="server-max"></span></p>
            <p class="server" id="server"></p>
            <ul class="roster" id="heads"></ul>
          </section>
          <section class="panel news hidden" id="news"></section>
        </div>
      </div>

    </main>
  </section>

  <!-- ============ Menú de cuentas ============ -->
  <div id="account-menu" class="popup hidden" role="menu"></div>

  <!-- ============ Diálogos ============ -->
  <div id="modal" class="modal hidden">
    <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <script src="sfx.js"></script>
  <script src="app.js"></script>
</body>
</html>
